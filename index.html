<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELEZ Cloud OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; overflow: hidden; }
    
    .header { text-align: center; margin-top: 20px; }
    .time { font-size: 3.5rem; font-weight: 300; letter-spacing: 2px; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    .date { font-size: 1.1rem; color: #94a3b8; margin-top: 5px; }
    
    .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 25px; padding: 20px; justify-items: center; align-content: start; flex-grow: 1; margin-top: 30px; overflow-y: auto; }
    .app-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
    .app-card:active { transform: scale(0.9); }
    .app-icon { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .app-name { margin-top: 8px; font-size: 13px; color: #e2e8f0; font-weight: 500; text-align: center; }
    
    .dock { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 28px; padding: 12px 24px; display: flex; gap: 20px; margin: 0 auto 10px auto; border: 1px solid rgba(255,255,255,0.15); }
    
    .app-window { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 100; flex-direction: column; }
    .window-bar { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .window-title { font-weight: 600; font-size: 16px; color: #f8fafc; }
    .close-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .window-content { flex-grow: 1; width: 100%; height: 100%; border: none; }

    /* SELEZ Özel Tasarımı */
    .yt-brand { background: #ff0000; color: white; font-weight: 900; padding: 6px 14px; border-radius: 8px; font-size: 18px; letter-spacing: 1px; }
    .yt-search-box { display: flex; gap: 8px; }
    .yt-search-input { padding: 8px 16px; border-radius: 20px; border: 1px solid #333; background: #121212; color: white; outline: none; width: 280px; font-size: 14px; }
    .yt-search-btn { padding: 8px 16px; border-radius: 20px; border: none; background: #cc0000; color: white; cursor: pointer; font-weight: bold; }
    
    .yt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px 20px 80px 20px; background: #0f0f0f; flex: 1; overflow-y: auto; }
    .yt-card { background: #181818; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .yt-card:hover { transform: translateY(-4px); }
    .yt-thumb { width: 100%; height: 130px; object-fit: cover; }
    .yt-title { padding: 10px; font-size: 13px; font-weight: 600; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Alt Navigasyon Menüsü */
    .yt-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #121212; border-top: 1px solid #272727; display: flex; justify-content: space-around; align-items: center; z-index: 105; }
    .nav-btn { background: none; border: none; color: #aaa; display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; gap: 3px; font-weight: 500; }
    .nav-btn:hover, .nav-btn.active { color: #fff; }
    .nav-icon { font-size: 20px; }

    .form-container { padding: 30px; display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 40px auto; background: #1e293b; border-radius: 20px; border: 1px solid #334155; }
    .form-container input { padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
    .form-container button { padding: 12px; border-radius: 10px; border: none; background: #10b981; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="time" id="clock">00:00</div>
    <div class="date" id="date">SELEZ Cloud OS</div>
  </div>

  <div class="apps-grid" id="appsGrid">
    <div class="app-card" onclick="openSelezYT()">
      <div class="app-icon" style="background: #ef4444;">▶</div>
      <span class="app-name">SELEZ</span>
    </div>
    <div class="app-card" onclick="openApp('Tarayıcı', 'https://www.google.com/search?igu=1')">
      <div class="app-icon" style="background: #3b82f6;">🌐</div>
      <span class="app-name">Tarayıcı</span>
    </div>
    <div class="app-card" onclick="openAddAppModal()">
      <div class="app-icon" style="background: #10b981;">➕</div>
      <span class="app-name">App Ekle</span>
    </div>
  </div>

  <div class="dock">
    <div class="app-card" onclick="openSelezYT()">
      <div class="app-icon" style="background: #ef4444;">▶</div>
    </div>
    <div class="app-card" onclick="openApp('Tarayıcı', 'https://www.google.com/search?igu=1')">
      <div class="app-icon" style="background: #3b82f6;">🌐</div>
    </div>
  </div>

  <!-- SELEZ Video Penceresi -->
  <div class="app-window" id="selezYtWindow">
    <div class="window-bar" style="background: #0f0f0f; border-bottom: 1px solid #272727;">
      <span class="yt-brand" onclick="openAnaSayfa()" style="cursor:pointer;">SELEZ</span>
      <div class="yt-search-box">
        <input type="text" id="ytQuery" class="yt-search-input" placeholder="SELEZ'de Ara..." onkeypress="if(event.key==='Enter') searchYouTube()">
        <button class="yt-search-btn" onclick="searchYouTube()">Ara</button>
      </div>
      <button class="close-btn" onclick="closeSelezYT()">✕ Kapat</button>
    </div>

    <!-- İçerik Alanı -->
    <div id="ytContent" class="yt-grid"></div>

    <!-- Alt Menü (Navigasyon) -->
    <div class="yt-bottom-nav">
      <button class="nav-btn" onclick="openAnaSayfa()">
        <span class="nav-icon">🏠</span>
        <span>Ana Sayfa</span>
      </button>
      <button class="nav-btn" onclick="openShorts()">
        <span class="nav-icon">📱</span>
        <span>Shorts</span>
      </button>
      <button class="nav-btn" onclick="openKitaplik()">
        <span class="nav-icon">📚</span>
        <span>Kitaplık</span>
      </button>
    </div>
  </div>

  <!-- Genel Tarayıcı Penceresi -->
  <div class="app-window" id="appWindow">
    <div class="window-bar">
      <span class="window-title" id="windowTitle">Uygulama</span>
      <button class="close-btn" onclick="closeApp()">✕ Kapat</button>
    </div>
    <iframe class="window-content" id="appIframe" src=""></iframe>
  </div>

  <!-- Uygulama Ekleme Penceresi -->
  <div class="app-window" id="addAppWindow">
    <div class="window-bar">
      <span class="window-title">Yeni Uygulama Ekle</span>
      <button class="close-btn" onclick="closeAddAppModal()">✕ Kapat</button>
    </div>
    <div class="form-container">
      <input type="text" id="appNameInput" placeholder="Uygulama Adı">
      <input type="text" id="appUrlInput" placeholder="URL (https://...)">
      <input type="text" id="appIconInput" placeholder="İkon/Emoji (📖, 🚀)">
      <button onclick="saveCustomApp()">Masaüstüne Ekle</button>
    </div>
  </div>

  <script>
    // GOOGLE CLOUD API KEY (Kendi API anahtarını buraya eklemelisin)
    const API_KEY = 'AIzaSyBSMTKc6QUmV6ikTML0figdXRuHDJPoG8o';

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('date').innerText = now.toLocaleDateString('tr-TR', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openSelezYT() {
      document.getElementById('selezYtWindow').style.display = 'flex';
      openAnaSayfa();
    }

    function closeSelezYT() {
      document.getElementById('selezYtWindow').style.display = 'none';
      document.getElementById('ytContent').innerHTML = '';
    }

    function openAnaSayfa() {
      loadTrendingYT();
    }

    async function loadTrendingYT() {
      const container = document.getElementById('ytContent');
      container.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1/-1; padding: 40px;">Popüler içerikler yükleniyor...</div>';
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&chart=mostPopular&regionCode=TR&maxResults=12&key=${API_KEY}`);
        const data = await res.json();
        renderYTVideos(data.items);
      } catch (err) {
        container.innerHTML = '<div style="color:#ef4444; text-align:center; grid-column: 1/-1;">İçerikler yüklenemedi. API Anahtarını kontrol edin.</div>';
      }
    }

    async function searchYouTube() {
      const query = document.getElementById('ytQuery').value;
      if(!query) return;
      const container = document.getElementById('ytContent');
      container.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1/-1; padding: 40px;">Aranıyor...</div>';
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`);
        const data = await res.json();
        renderYTVideos(data.items);
      } catch (err) {
        container.innerHTML = '<div style="color:#ef4444; text-align:center; grid-column: 1/-1;">Arama sonucu bulunamadı.</div>';
      }
    }

    /* SHORTS AKIŞI */
    async function openShorts() {
      const container = document.getElementById('ytContent');
      container.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1/-1; padding: 40px;">Shorts Akışı Yükleniyor...</div>';
      try {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&type=video&videoDuration=short&q=shorts&key=${API_KEY}`);
        const data = await res.json();
        renderShorts(data.items);
      } catch (err) {
        container.innerHTML = '<div style="color:#ef4444; text-align:center; grid-column: 1/-1;">Shorts içerikleri yüklenemedi.</div>';
      }
    }

    function renderShorts(items) {
      const container = document.getElementById('ytContent');
      container.innerHTML = '';
      if(!items || items.length === 0) {
        container.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1/-1;">Shorts bulunamadı.</div>';
        return;
      }
      items.forEach(item => {
        const videoId = item.id.videoId || item.id;
        const snippet = item.snippet;
        const card = document.createElement('div');
        card.style = "grid-column: 1/-1; display:flex; flex-direction:column; align-items:center; background:#181818; padding:15px; border-radius:16px; margin-bottom:20px;";
        card.innerHTML = `
          <h4 style="margin-bottom:10px; color:#fff; text-align:center; font-size:14px;">${snippet.title}</h4>
          <iframe style="width:100%; max-width:340px; height:520px; border:none; border-radius:12px;" 
                  src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=0&rel=0" 
                  allowfullscreen>
          </iframe>
        `;
        container.appendChild(card);
      });
    }

    /* KİTAPLIK VE GEÇMİŞ */
    function addToHistory(id, title, thumb) {
      let history = JSON.parse(localStorage.getItem('selez_history') || '[]');
      history = history.filter(item => item.id !== id);
      history.unshift({ id, title, thumb, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
      if(history.length > 30) history.pop();
      localStorage.setItem('selez_history', JSON.stringify(history));
    }

    function openKitaplik() {
      const container = document.getElementById('ytContent');
      const history = JSON.parse(localStorage.getItem('selez_history') || '[]');
      container.innerHTML = '';

      const headerDiv = document.createElement('div');
      headerDiv.style = "grid-column: 1/-1; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;";
      headerDiv.innerHTML = `
        <h3 style="color:#fff;">📚 İzleme Geçmişi</h3>
        ${history.length > 0 ? '<button onclick="clearHistory()" style="background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:bold;">Geçmişi Temizle</button>' : ''}
      `;
      container.appendChild(headerDiv);

      if(history.length === 0) {
        const emptyMsg = document.createElement('div');
        emptyMsg.style = "color:#aaa; text-align:center; grid-column: 1/-1; padding: 40px;";
        emptyMsg.innerText = "Henüz izleme geçmişiniz yok.";
        container.appendChild(emptyMsg);
        return;
      }

      history.forEach(item => {
        const card = document.createElement('div');
        card.className = 'yt-card';
        card.onclick = () => playYTVideo(item.id, item.title, item.thumb);
        card.innerHTML = `
          <img class="yt-thumb" src="${item.thumb}" alt="thumb">
          <div class="yt-title">${item.title}</div>
          <div style="font-size:11px; color:#888; padding:0 10px 10px 10px;">İzlendi: ${item.time}</div>
        `;
        container.appendChild(card);
      });
    }

    function clearHistory() {
      localStorage.removeItem('selez_history');
      openKitaplik();
    }

    function renderYTVideos(items) {
      const container = document.getElementById('ytContent');
      container.innerHTML = '';
      if(!items || items.length === 0) {
        container.innerHTML = '<div style="color:#aaa; text-align:center; grid-column: 1/-1;">Sonuç bulunamadı.</div>';
        return;
      }
      items.forEach(item => {
        const videoId = item.id.videoId || item.id;
        const snippet = item.snippet;
        const thumb = snippet.thumbnails?.high?.url || snippet.thumbnails?.default?.url;
        const titleEscaped = snippet.title.replace(/'/g, "\\'");
        const card = document.createElement('div');
        card.className = 'yt-card';
        card.onclick = () => playYTVideo(videoId, titleEscaped, thumb);
        card.innerHTML = `
          <img class="yt-thumb" src="${thumb}" alt="thumb">
          <div class="yt-title">${snippet.title}</div>
        `;
        container.appendChild(card);
      });
    }

    function playYTVideo(id, title, thumb) {
      if(title && thumb) {
        addToHistory(id, title, thumb);
      }
      const container = document.getElementById('ytContent');
      container.innerHTML = `
        <div style="grid-column: 1/-1; height: 100%; display: flex; flex-direction: column;">
          <button onclick="openAnaSayfa()" style="align-self: start; margin-bottom: 10px; padding: 8px 16px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">← Ana Sayfaya Dön</button>
          <iframe style="width: 100%; height: 70vh; border: none; border-radius: 12px;" 
                  src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" 
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                  allowfullscreen>
          </iframe>
        </div>
      `;
    }

    function openApp(title, url) {
      document.getElementById('windowTitle').innerText = title;
      document.getElementById('appIframe').src = url;
      document.getElementById('appWindow').style.display = 'flex';
    }

    function closeApp() {
      document.getElementById('appWindow').style.display = 'none';
      document.getElementById('appIframe').src = '';
    }

    function openAddAppModal() { document.getElementById('addAppWindow').style.display = 'flex'; }
    function closeAddAppModal() { document.getElementById('addAppWindow').style.display = 'none'; }

    function saveCustomApp() {
      const name = document.getElementById('appNameInput').value;
      const url = document.getElementById('appUrlInput').value;
      const icon = document.getElementById('appIconInput').value || '📱';
      if(!name || !url) { alert('Lütfen isim ve URL girin!'); return; }

      const customApps = JSON.parse(localStorage.getItem('customApps') || '[]');
      customApps.push({ name, url, icon });
      localStorage.setItem('customApps', JSON.stringify(customApps));
      renderCustomApps();
      closeAddAppModal();
    }

    function renderCustomApps() {
      const customApps = JSON.parse(localStorage.getItem('customApps') || '[]');
      const grid = document.getElementById('appsGrid');
      document.querySelectorAll('.custom-app-card').forEach(el => el.remove());
      customApps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card custom-app-card';
        card.onclick = () => openApp(app.name, app.url);
        card.innerHTML = `
          <div class="app-icon" style="background: #475569;">${app.icon}</div>
          <span class="app-name">${app.name}</span>
        `;
        grid.appendChild(card);
      });
    }

    renderCustomApps();
  </script>
</body>
</html>
