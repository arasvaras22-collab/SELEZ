<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; overflow: hidden; }
    .header { text-align: center; margin-top: 20px; }
    .time { font-size: 3.5rem; font-weight: 300; letter-spacing: 2px; text-shadow: 0 4px 12px rgba(0,0,0,0.5); }
    .date { font-size: 1.1rem; color: #94a3b8; margin-top: 5px; }
    .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 25px; padding: 20px; justify-items: center; align-content: start; flex-grow: 1; margin-top: 30px; }
    .app-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
    .app-card:active { transform: scale(0.9); }
    .app-icon { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
    .app-name { margin-top: 8px; font-size: 13px; color: #e2e8f0; font-weight: 500; }
    .dock { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 28px; padding: 12px 24px; display: flex; gap: 20px; margin: 0 auto 10px auto; border: 1px solid rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div class="header">
    <div class="time" id="clock">00:00</div>
    <div class="date" id="date">Bulut İşletim Sistemi</div>
  </div>

  <div class="apps-grid" id="appsGrid">
    <div class="app-card" onclick="alert('YouTube modülü birazdan ekleniyor!')">
      <div class="app-icon" style="background: #ef4444;">▶</div>
      <span class="app-name">YouTube</span>
    </div>
    <div class="app-card" onclick="alert('Tarayıcı modülü birazdan ekleniyor!')">
      <div class="app-icon" style="background: #3b82f6;">🌐</div>
      <span class="app-name">Tarayıcı</span>
    </div>
    <div class="app-card" onclick="alert('Uygulama ekleme modülü hazırlanıyor!')">
      <div class="app-icon" style="background: #10b981;">➕</div>
      <span class="app-name">App Ekle</span>
    </div>
  </div>

  <div class="dock">
    <div class="app-card" onclick="alert('YouTube')">
      <div class="app-icon" style="background: #ef4444;">▶</div>
    </div>
    <div class="app-card" onclick="alert('Tarayıcı')">
      <div class="app-icon" style="background: #3b82f6;">🌐</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
